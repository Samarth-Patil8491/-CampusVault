apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: campusvault

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: campusvault-frontend:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 80

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"