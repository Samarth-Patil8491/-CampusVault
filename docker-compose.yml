version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: campusvault-postgres

    restart: always

    environment:
      POSTGRES_DB: campusvault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend

    container_name: campusvault-backend

    depends_on:
      - postgres

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/campusvault
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  frontend:
    build: ./frontend

    container_name: campusvault-frontend

    depends_on:
      - backend

    ports:
      - "3000:80"

volumes:
  postgres-data: